# Render Blueprint — deploy with "New + Blueprint" and point it at this repo.
# The API keys are marked sync: false, so Render asks for them in the dashboard
# instead of reading them from this file. Never put real keys here.
services:
  - type: web
    name: easyall
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SPEECHIFY_API_KEY
        sync: false
