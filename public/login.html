<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EasyAll — Sign in</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff7ed;
      color: #292524;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
    }
    .box {
      width: 100%;
      max-width: 360px;
      background: #fff;
      border: 1px solid #fde9d7;
      border-radius: 18px;
      box-shadow: 0 6px 24px rgba(194, 65, 12, 0.08);
      padding: 28px 24px;
      text-align: center;
    }
    h1 { margin: 0 0 6px; font-size: 26px; }
    p { margin: 0 0 18px; color: #78716c; font-size: 14px; }
    input {
      width: 100%;
      padding: 13px 14px;
      font-size: 16px;
      border: 2px solid #fde9d7;
      border-radius: 12px;
      background: #fff7ed;
      outline: none;
      margin-bottom: 12px;
    }
    input:focus { border-color: #ea580c; }
    button {
      width: 100%;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #f97316, #dc2626);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 13px;
      cursor: pointer;
    }
    .error { color: #b91c1c; font-size: 13.5px; min-height: 18px; margin: 10px 0 0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🎙️ EasyAll</h1>
    <p>This studio is password protected. Enter the password to continue.</p>
    <form id="loginForm">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" autofocus>
      <button type="submit">Enter</button>
    </form>
    <p class="error" id="error"></p>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      const password = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'That password is not right.';
          return;
        }
        window.location.href = '/';
      } catch {
        errorEl.textContent = 'Could not reach the server. Check your connection and try again.';
      }
    });
  </script>
</body>
</html>
